# Video output
vo=gpu-next
gpu-api=vulkan
gpu-context=auto
hwdec=auto-safe

# Scaling & Quality Profiles
profile=high-quality
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
dither-depth=auto
correct-downscaling=yes
linear-downscaling=yes

# Subtitles & Audio
alang=jpn,ja,eng,en
slang=eng,en
sub-auto=fuzzy

# UI & Playback
force-window=immediate
keep-open=yes
save-position-on-quit=yes
osc=yes
